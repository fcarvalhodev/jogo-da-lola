<style>
/* Layout: one-screen arcade cabinet — 16:9 canvas stage, story panels float over it, touch pad below (portrait) or over it (landscape). Single deliberate dark look. */
:root{
  --night:#140c2b; --plum:#2a1850; --pink:#ff4fa0; --lilac:#b48cff; --sun:#ffd34e; --ink:#fff7fb; --muted:#c9b8ec;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;
  background-image:radial-gradient(circle at 20% 0%,#3b1f6e 0,transparent 55%),radial-gradient(circle at 90% 100%,#4a1240 0,transparent 50%)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 16px;box-sizing:border-box;position:relative}
#stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #3d2775,0 18px 50px rgba(0,0,0,.55);container-type:size;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4cqh 5cqw;background:rgba(20,12,43,.55);backdrop-filter:blur(2px)}
.card{max-width:min(620px,88cqw);max-height:92cqh;overflow:auto;background:linear-gradient(160deg,#2f1a5c,#1d1040);border:2px solid #5c3fa8;border-radius:16px;padding:clamp(12px,3.4cqh,28px) clamp(14px,4cqw,32px);text-align:center;display:flex;flex-direction:column;gap:clamp(4px,1.6cqh,12px);box-shadow:0 10px 0 #120a28}
.eyebrow{font-family:var(--display);font-size:clamp(9px,2.1cqw,13px);letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
.card h1{font-size:clamp(22px,7cqw,58px);color:var(--pink);text-shadow:3px 3px 0 #5a1240,0 0 22px rgba(255,79,160,.45)}
.card h2{font-size:clamp(15px,4cqw,30px);color:var(--ink)}
.card p{margin:0;font-size:clamp(12px,2.6cqw,18px);line-height:1.35;color:var(--muted)}
.card p strong{color:var(--ink)}
.keys{font-size:clamp(11px,2.2cqw,15px)!important;color:var(--lilac)!important}
.msg{font-family:var(--body);font-weight:800;font-size:clamp(14px,3.6cqw,26px)!important;color:var(--ink)!important;line-height:1.25!important;text-wrap:balance}
.go{align-self:center;font-family:var(--display);font-size:clamp(13px,3cqw,22px);color:#2a0a1c;background:var(--sun);border:0;border-radius:12px;padding:.55em 1.3em;box-shadow:0 5px 0 #b8861b;cursor:pointer;margin-top:4px}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b8861b}
.go:focus-visible,#pad button:focus-visible,#mute:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.panel.ending{align-items:flex-end;background:linear-gradient(to top,rgba(20,12,43,.85),transparent 60%)}
.panel.ending .card{background:rgba(29,16,64,.88)}
#mute{position:absolute;right:1.4cqw;bottom:2cqh;font-family:var(--display);font-size:clamp(9px,1.8cqw,12px);background:rgba(20,12,43,.7);color:var(--ink);border:1px solid #5c3fa8;border-radius:8px;padding:.35em .7em;cursor:pointer}
#pad{display:none;width:100%;max-width:640px;gap:12px}
#pad button{flex:1;font-family:var(--display);font-size:18px;padding:18px 0;border-radius:16px;border:0;color:#2a0a1c;touch-action:none}
#bJump{background:var(--pink);box-shadow:0 6px 0 #a3245e}
#bDuck{background:var(--lilac);box-shadow:0 6px 0 #6b4fb0}
#pad button.on{transform:translateY(4px);box-shadow:none}
@media (pointer:coarse){#pad{display:flex}}
@media (pointer:coarse) and (orientation:landscape){
  #pad{position:absolute;left:16px;right:16px;bottom:16px;max-width:none;justify-content:space-between;pointer-events:none}
  #pad button{flex:0 0 auto;width:120px;padding:14px 0;font-size:14px;opacity:.82;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){.go:active{transform:none}}
</style>

<body>
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Jogo A Saga da Lola"></canvas>
    <div id="panel" class="panel"></div>
    <button id="mute" type="button">SOM: ON</button>
  </div>
  <div id="pad">
    <button id="bDuck" type="button">▼ ABAIXAR</button>
    <button id="bJump" type="button">▲ PULAR</button>
  </div>
</div>

<script>
(()=>{
const W=960,H=540,GROUND=470;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage'),panel=document.getElementById('panel'),pad=document.getElementById('pad');
const TOUCH=matchMedia('(pointer:coarse)').matches;

function fit(){
  const padH=(getComputedStyle(pad).display!=='none'&&getComputedStyle(pad).position!=='absolute')?pad.offsetHeight+12:0;
  let w=Math.min(window.innerWidth-32,1280),h=w*9/16;
  const maxH=window.innerHeight-24-padH;
  if(h>maxH){h=maxH;w=h*16/9}
  stage.style.width=w+'px';stage.style.height=h+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
addEventListener('resize',fit);fit();

/* ---------- helpers ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
function rr(x,y,w,h,r,c){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(c){ctx.fillStyle=c;ctx.fill()}}
function dot(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function ell(x,y,rx,ry,c,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function seg(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
function heart(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,-3);ctx.bezierCurveTo(0,-6,-5,-11,-9,-8);ctx.bezierCurveTo(-13,-4,-8,3,0,8);ctx.bezierCurveTo(8,3,13,-4,9,-8);ctx.bezierCurveTo(5,-11,0,-6,0,-3);ctx.fillStyle=col;ctx.fill();ctx.restore()}
function txt(s,x,y,size,col,align='center',font='Baloo 2',weight=800){ctx.font=`${weight} ${size}px "${font}", "Trebuchet MS", sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y)}
function bubble(x,y,s){
  ctx.font='800 15px "Baloo 2","Trebuchet MS",sans-serif';const w=ctx.measureText(s).width+18;
  rr(x-w/2,y-15,w,28,10,'#ffffff');ctx.beginPath();ctx.moveTo(x-5,y+12);ctx.lineTo(x+4,y+12);ctx.lineTo(x-2,y+21);ctx.fill();
  txt(s,x,y-1,15,'#2a1440');
}

/* ---------- audio ---------- */
let AC=null,muted=false;
// iPhone mutes Web Audio when the silent switch is on; a looping silent <audio> element plus
// audioSession 'playback' moves the page into the media category so the music plays anyway.
let unlockEl=null;
function silentWav(){const n=800,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
  let s='';b.forEach(c=>s+=String.fromCharCode(c));return 'data:audio/wav;base64,'+btoa(s)}
function audio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!unlockEl){unlockEl=new Audio(silentWav());unlockEl.loop=true;unlockEl.setAttribute('playsinline','')}
  if(unlockEl.paused){const p=unlockEl.play();if(p&&p.catch)p.catch(()=>{})}
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC){if(AC.state!=='running')AC.resume().catch(()=>{});
    try{const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0)}catch(e){}}
}
['pointerdown','touchend','click','keydown'].forEach(n=>addEventListener(n,audio,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&AC.state!=='running')AC.resume().catch(()=>{})});
function beep(f,d=.1,type='square',v=.04,slide=0){if(muted||!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}
const sfx={jump:()=>beep(440,.14,'square',.035,1.8),coin:()=>{beep(988,.07);setTimeout(()=>beep(1319,.12),60)},hurt:()=>beep(220,.3,'sawtooth',.05,.4),stomp:()=>beep(300,.15,'square',.05,.5),power:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.05),i*70))},win:()=>{[523,659,784,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.06),i*120))}};
document.getElementById('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'SOM: OFF':'SOM: ON';e.target.blur()};

/* ---------- music: original pop-punk chiptune, one track per phase ---------- */
const _=null;
const SONGS={
 title:{bpm:150,root:110,prog:[0,7,9,5],mel:[0,_,4,7,9,7,4,_,7,_,11,12,11,7,_,4,9,_,12,9,7,4,2,_,5,_,9,7,5,4,2,_]},
 p0:{bpm:170,root:110,prog:[0,7,9,5],mel:[0,_,4,7,9,7,4,_,7,_,11,12,11,7,_,4,9,_,12,9,7,4,2,_,5,_,9,7,5,4,2,_]},
 p1:{bpm:178,root:73.42,prog:[0,5,7,5],mel:[7,9,12,_,12,9,7,_,5,9,12,14,12,_,9,_,7,11,14,_,14,12,11,_,9,_,12,9,7,5,4,_]},
 p2:{bpm:142,root:82.41,prog:[0,8,3,10],mel:[12,_,10,7,8,_,7,3,8,_,7,3,0,_,3,_,10,_,7,10,12,_,10,7,10,_,12,14,15,_,12,_]},
 p3:{bpm:186,root:98,prog:[0,7,9,5],mel:[12,12,14,12,_,9,7,_,11,11,12,11,_,7,4,_,9,9,12,14,_,12,9,_,5,7,9,12,_,9,7,_]},
 p4:{bpm:194,root:69.3,prog:[0,8,10,7],mel:[0,3,7,12,7,3,0,_,8,12,15,12,8,_,7,_,10,14,17,14,10,_,12,_,7,11,14,19,_,14,11,_]},
 end:{bpm:150,root:65.41,prog:[0,5,7,0],mel:[12,_,14,16,19,_,16,_,17,_,16,14,12,_,9,_,14,_,16,17,19,_,21,19,24,_,19,_,16,_,12,_]}
};
let music=null,bus=null,gtr=null,noise=null;
function initBus(){
  if(bus||!AC)return;
  bus=AC.createGain();bus.gain.value=.55;bus.connect(AC.destination);
  const ws=AC.createWaveShaper(),c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;c[i]=Math.tanh(x*6)}ws.curve=c;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  gtr=AC.createGain();gtr.gain.value=.5;gtr.connect(ws);ws.connect(lp);lp.connect(bus);
  noise=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
}
function note(dest,type,f,t0,len,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+len);o.connect(g).connect(dest);o.start(t0);o.stop(t0+len+.02)}
function hit(t0,len,v,ftype,freq){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise;f.type=ftype;f.frequency.value=freq;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+len);s.connect(f).connect(g).connect(bus);s.start(t0);s.stop(t0+len+.02)}
function kick(t0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t0);o.frequency.exponentialRampToValueAtTime(40,t0+.12);g.gain.setValueAtTime(.5,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.16);o.connect(g).connect(bus);o.start(t0);o.stop(t0+.18)}
function step(s,n,t0,d){
  const bar=Math.floor(n/8)%4,i=n%8,r=s.root*Math.pow(2,s.prog[bar]/12);
  note(bus,'triangle',r,t0,d*.9,.22);
  note(gtr,'sawtooth',r*2,t0,d*.55,.09);note(gtr,'sawtooth',r*2*1.4983,t0,d*.55,.07);note(gtr,'sawtooth',r*4,t0,d*.55,.05);
  if(i===0||i===4||(i===5&&bar%2))kick(t0);
  if(i===2||i===6)hit(t0,.13,.28,'bandpass',1800);
  hit(t0,.03,.06,'highpass',7000);
  const m=s.mel[n%32];if(m!==null){const nx=s.mel[(n+1)%32];note(bus,'square',s.root*4*Math.pow(2,m/12),t0,nx===null?d*1.8:d*.85,.05)}
}
function playSong(k){music={s:SONGS[k],n:0,next:0}}
function tickMusic(){
  if(!AC||!music||AC.state!=='running')return;initBus();
  const now=AC.currentTime,d=60/music.s.bpm/2;
  if(music.next<now-.2)music.next=now+.05;
  while(music.next<now+.15){if(!muted)step(music.s,music.n,music.next,d);music.n++;music.next+=d}
}

/* ---------- state ---------- */
let state='title',pi=0,T=0,last=0,scroll=0,elapsed=0,spawnT=1,shake=0;

/* ---------- backgrounds ---------- */
function layer(f,P_,fn){let off=-((scroll*f)%P_);for(let b=off-P_;b<W+P_;b+=P_)fn(b)}
const SK=Array.from({length:40},(_,i)=>({x:hash(i)*W,y:hash(i+50)*GROUND,s:rand(.5,1.2)}));
function drawBg(key,t){
  let g;
  if(key==='tokyo'){
    g=ctx.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#160f3a');g.addColorStop(1,'#5a2d72');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    SK.forEach(s=>{if(s.y<260)dot(s.x,s.y*.6,s.s,'rgba(255,255,255,.6)')});
    dot(800,90,34,'#ffe9b8');dot(812,82,34,'#3b2160');
    // fuji

  wingB(-48,-14,'#9c4a1c',.6,.9);wingB(-6,-22,'#b85c25',.85,0);
  ctx.strokeStyle='#e8a33d';ctx.lineCap='round';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(-50,0);ctx.quadraticCurveTo(-110,14+f*6,-160,-18+f*10);ctx.stroke();
  ctx.fillStyle='#c9661f';ctx.beginPath();ctx.moveTo(-155,-34+f*10);ctx.lineTo(-185,-18+f*10);ctx.lineTo(-155,-2+f*10);ctx.lineTo(-165,-18+f*10);ctx.fill();
  ctx.strokeStyle='#d18a2c';ctx.lineWidth=13;seg(-26,18,-30,44);seg(-6,20,-2,46);ctx.lineWidth=4;ctx.strokeStyle='#f3e2c0';seg(-34,46,-40,50);seg(-2,48,4,52);
  ell(0,0,62,27,'#e8a33d');ell(8,10,46,13,'#ffd98a');
  ctx.strokeStyle='#e8a33d';ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(44,-8);ctx.quadraticCurveTo(84,-28,94,-62);ctx.stroke();
  ell(108,-72,26,16,'#e8a33d');ell(128,-66,12,9,'#efb75a');
  ctx.strokeStyle='#7a3f12';ctx.lineWidth=5;seg(96,-84,84,-104);seg(106,-86,100,-108);
  dot(110,-76,5,'#fff');dot(112,-76,2.6,'#2a1a1a');dot(136,-68,1.8,'#7a3f12');
  for(let i=0;i<5;i++){ctx.fillStyle='#c9661f';ctx.beginPath();ctx.moveTo(-40+i*16,-28);ctx.lineTo(-33+i*16,-40);ctx.lineTo(-26+i*16,-28);ctx.fill()}
  wingB(-40,-20,'#c76a2a',.68,.9);wingB(4,-28,'#d9792f',1,0);
  ctx.restore();
}
function drawRiders(x,y,s,t,chest){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  drawPerson({x:-30,y:-6,d:DEF.rider,sit:true,still:true},t);
  drawLola(12,-4,{t,chest,sit:true,wave:true,s:1.15});
  rr(-50,-34,80,14,6,'#7a3f12');
  ctx.restore();
}
function drawGoal(g,t){
  const x=g.x;
  if(g.kind==='airport'){rr(x,GROUND-200,330,200,8,'#d9e2ff');ctx.fillStyle='#8fb0ff';for(let i=0;i<6;i++)ctx.fillRect(x+20+i*50,GROUND-170,36,90);rr(x+40,GROUND-240,250,36,8,'#2a1850');txt('空港 · AEROPORTO',x+165,GROUND-222,20,'#ffd34e','center','Bungee',400);
    ctx.save();ctx.translate(x+240,GROUND-290);ell(0,0,70,14,'#fff');ctx.fillStyle='#ff4fa0';ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-40,-40);ctx.lineTo(-20,-40);ctx.lineTo(20,0);ctx.fill();ctx.restore();rr(x+20,GROUND-60,60,60,4,'#2a1850')}
  if(g.kind==='hospital'){rr(x,GROUND-260,300,260,6,'#f2f6f8');ctx.fillStyle='#9ad1ff';for(let r=0;r<3;r++)for(let c=0;c<5;c++)ctx.fillRect(x+20+c*56,GROUND-230+r*56,36,36);rr(x+90,GROUND-300,120,40,6,'#e63946');txt('HOSPITAL',x+150,GROUND-280,20,'#fff','center','Bungee',400);rr(x+10,GROUND-70,70,70,4,'#6fa8c9')}
  if(g.kind==='alta'){rr(x,GROUND-200,140,200,8,'#06a77d');rr(x+15,GROUND-180,110,180,6,'#0bd19c');txt('ALTA ✓',x+70,GROUND-220,22,'#06a77d','center','Bungee',400);txt('SAÍDA',x+70,GROUND-100,18,'#fff','center','Bungee',400)}
  if(g.kind==='festa'){rr(x,GROUND-220,260,220,8,'#ffb3d1');ctx.fillStyle='#ff4fa0';ctx.beginPath();ctx.moveTo(x-20,GROUND-220);ctx.lineTo(x+130,GROUND-310);ctx.lineTo(x+280,GROUND-220);ctx.fill();rr(x+90,GROUND-90,80,90,6,'#7a3f62');txt('FESTA DA LOLA',x+130,GROUND-170,20,'#2a1850','center','Bungee',400);
    ['#ffd34e','#3fe0ff','#b48cff','#7ae582'].forEach((c,i)=>{const bx=x+20+i*70,by=GROUND-330+Math.sin(t*3+i)*8;ctx.strokeStyle='#555';ctx.lineWidth=1;seg(bx,by+14,bx+5,GROUND-220);ell(bx,by,14,18,c)})}
  if(g.kind==='dragao'){drawDragon(x+60,g.y,1,t);rr(x+20,g.y-34,80,14,6,'#7a3f12');drawPerson({x:x+50,y:g.y-26,d:DEF.rider,sit:true,still:true,wave:true},t)}
}

/* ---------- game flow ---------- */
function startPhase(i){
  pi=i;state='play';elapsed=0;spawnT=1.2;scroll=0;ents=[];parts=[];goal=null;
  phaseScore=score;hearts=Math.max(hearts,3);hemo=30;party=0;
  Object.assign(P,{y:GROUND,vy:0,onG:true,jumps:0,inv:1});
  hidePanel();playSong('p'+i);
}
function spawn(){
  const ph=PH[pi],tot=ph.spawns.reduce((a,s)=>a+s[1],0);let r=Math.random()*tot,type=ph.spawns[0][0];
  for(const [k,w] of ph.spawns){if((r-=w)<=0){type=k;break}}
  const sp=ph.speed;
  if(type==='coins'){const by=GROUND-40-Math.random()*120;for(let i=0;i<5;i++)ents.push({t:'col',kind:'coin',x:W+40+i*38,y:by-Math.sin(i/4*Math.PI)*45,vx:-sp});return}
  if(['heart','onigiri','sangue','festa'].includes(type)){ents.push({t:'col',kind:type,sub:Math.floor(Math.random()*4),x:W+40,y:GROUND-40-Math.random()*140,vx:-sp});return}
  if(LOW[type]){ents.push({t:'low',kind:type,x:W+60,y:GROUND,w:LOW[type].w,h:LOW[type].h,vx:-sp});return}
  let d=DEF[type];if(type==='boy')d={...d,shirt:pick(BOY_SHIRTS),skin:pick(BOY_SKIN)};
  ents.push({t:'npc',kind:type,d,x:W+60,y:GROUND,w:30,h:d.h,vx:-(sp+d.extra),seed:Math.random()*9,say:pick(d.lines),sayT:2.4,shout:type==='vermelho'||type==='selecao'});
}
function burst(x,y,n,cols,spd=260){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rand(.3,1)*spd;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:rand(.5,1),col:pick(cols),s:rand(2,5)})}}
function floater(x,y,s,col){parts.push({x,y,vx:0,vy:-60,life:1,text:s,col})}
function hurt(){
  if(P.inv>0)return;hearts--;P.inv=1.4;shake=.3;sfx.hurt();burst(P.x,P.y-30,14,['#ff3b6b','#fff']);
  if(hearts<=0){state='dead';showDead()}
}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){
  const ph=PH[pi],sp=ph.speed;
  scroll+=sp*dt;elapsed+=dt;
  P.duck=duckKey||duckBtn;
  if(jumpQ){if(P.onG){P.vy=-840;P.onG=false;P.jumps=1;sfx.jump()}else if(P.jumps<2){P.vy=-720;P.jumps=2;sfx.jump();burst(P.x,P.y,6,['#fff','#ffe27a'],120)}jumpQ=false}
  P.prevY=P.y;P.vy+=(P.duck&&!P.onG?4600:2300)*dt;P.y+=P.vy*dt;
  if(P.y>=GROUND){P.y=GROUND;P.vy=0;P.onG=true;P.jumps=0}
  P.inv=Math.max(0,P.inv-dt);
  if(elapsed<ph.dur-1.5){spawnT-=dt;if(spawnT<=0){spawn();spawnT=rand(ph.gap[0],ph.gap[1])}}
  else if(!goal){goal=ph.goal==='dragao'?{kind:'dragao',x:W+120,y:150}:{kind:ph.goal,x:W+80}}
  if(ph.hemo){hemo-=5*dt;if(hemo<=0){hemo=30;const inv=P.inv;P.inv=0;hurt();if(state!=='dead')floater(P.x,P.y-90,'Tontura!','#ff3b6b')}}
  const ph_h=P.duck&&P.onG?36:60,pb={x:P.x-13,y:P.y-ph_h,w:26,h:ph_h};
  for(const e of ents){
    e.x+=e.vx*dt;if(e.sayT)e.sayT-=dt;
    if(e.t==='npc'&&e.d.k==='thrower'&&!e.thrown&&e.x<W-140&&e.x>P.x+230){
      e.thrown=true;const high=Math.random()<.7;
      ents.push({t:'proj',kind:e.d.proj,x:e.x-30,y:high?GROUND-52:GROUND-16,vx:-(sp+260),food:pick(['#6b3a1e','#f2b134','#3b2a1a','#e07a1f'])});
    }
    let box;
    if(e.t==='col')box={x:e.x-14,y:e.y-14,w:28,h:28};
    else if(e.t==='npc')box={x:e.x-14,y:e.y-e.h+8,w:28,h:e.h-8};
    else if(e.t==='low')box={x:e.x-e.w/2+6,y:e.y-e.h+4,w:e.w-12,h:e.h-4};
    else box={x:e.x-22,y:e.y-9,w:40,h:18};
    if(e.dead||!overlap(pb,box))continue;
    if(e.t==='col'){
      e.dead=true;
      if(e.kind==='coin'){score+=10;sfx.coin()}
      if(e.kind==='heart'){hearts=Math.min(5,hearts+1);sfx.power();floater(e.x,e.y-20,'+1 ♥','#ff3b6b')}
      if(e.kind==='onigiri'){score+=50;sfx.coin();floater(e.x,e.y-20,'+50','#fff')}
      if(e.kind==='sangue'){hemo=Math.min(100,hemo+22);score+=30;sfx.power();floater(e.x,e.y-20,'+sangue','#ff3b6b')}
      if(e.kind==='festa'){party++;score+=40;sfx.coin();floater(e.x,e.y-20,'+festa','#ffd34e')}
      burst(e.x,e.y,6,['#ffd34e','#fff']);
    } else if((e.t==='npc'||e.t==='low')&&P.vy>0&&P.prevY<=box.y+14){
      e.dead=true;score+=150;P.vy=-560;P.jumps=1;sfx.stomp();burst(e.x,box.y,16,['#ffffff','#ffd34e','#ff4fa0']);floater(e.x,box.y-20,e.t==='npc'?pick(['Tchau!','Sai fora!','Next!','Hoje não!']):'+150','#fff');
    } else {hurt();if(e.t==='proj')e.dead=true}
    if(state==='dead')return;
  }
  ents=ents.filter(e=>!e.dead&&e.x>-200);
  if(goal){
    if(goal.kind==='dragao'){goal.x-=sp*.75*dt;goal.y+=(GROUND-50-goal.y)*Math.min(1,dt*1.6);if(goal.x<P.x+40){state='ending';stateT=0;sfx.win();showEnding()}}
    else{goal.x-=sp*dt;if(goal.x<P.x-10){score+=ph.hemo?Math.round(hemo)*5:0;sfx.win();state='done';showDone()}}
  }
}
function updateParts(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.text)p.vy+=500*dt;p.life-=dt}parts=parts.filter(p=>p.life>0)}

/* ---------- rendering ---------- */
function drawHUD(){
  const ph=PH[pi];
  for(let i=0;i<5;i++)heart(30+i*30,32,1.25,i<hearts?'#ff3b6b':'rgba(255,255,255,.22)');
  ctx.font='400 22px Bungee,Impact,sans-serif';ctx.textAlign='right';ctx.lineWidth=5;ctx.strokeStyle='rgba(20,12,43,.75)';ctx.strokeText(String(score).padStart(5,'0'),W-20,30);ctx.fillStyle='#ffd34e';ctx.fillText(String(score).padStart(5,'0'),W-20,30);
  ctx.textAlign='center';ctx.font='400 15px Bungee,Impact,sans-serif';ctx.strokeText(`FASE ${pi+1} · ${ph.name.toUpperCase()}`,W/2,22);ctx.fillStyle='#fff';ctx.fillText(`FASE ${pi+1} · ${ph.name.toUpperCase()}`,W/2,22);
  const pw=280,px=W/2-pw/2,prog=Math.min(1,elapsed/ph.dur);rr(px,38,pw,10,5,'rgba(20,12,43,.6)');rr(px,38,Math.max(10,pw*prog),10,5,'#ff4fa0');dot(px+pw*prog,43,7,'#ffe27a');
  if(ph.hemo){rr(20,54,160,16,8,'rgba(20,12,43,.6)');rr(20,54,Math.max(16,160*hemo/100),16,8,hemo<35?'#ff3b6b':'#d00030');txt('HEMOGLOBINA',100,62,11,'#fff','center','Bungee',400)}
  if(ph.party)txt(`🎈 Itens da festa: ${party}`,20,66,16,'#fff','left');
}
function render(){
  ctx.save();
  if(shake>0){ctx.translate(rand(-6,6)*shake*3,rand(-6,6)*shake*3)}
  const ph=PH[pi];
  if(state==='ending'){
    drawBg('ceu',T);
    const bx=W/2-30,by=H/2+10+Math.sin(T*2)*12;
    drawDragon(bx,by,1.5,T);drawRiders(bx-6,by-42,1.5,T,true);
  } else if(state==='intro'){
    drawBg('tokyo',T);
    ctx.save();ctx.translate(W/2,96+Math.sin(T*2)*4);
    ctx.strokeStyle='#ddd';ctx.lineWidth=2;seg(-300,-30,-290,0);seg(300,-30,290,0);
    rr(-300,-26,600,56,14,'#c4142f');rr(-292,-20,584,44,10,'#17141c');
    txt('FELIZ ANIVERSÁRIO, LOLA!',0,3,30,'#ffd34e','center','Bungee',400);ctx.restore();
    const fr=[{x:430,d:DEF.amiga,say:'Tchau, Lola!'},{x:540,d:{...DEF.boy,shirt:'#06d6a0',skin:'#f1c9a5',hair:'#111',hs:'short'},say:'Boa viagem!'},{x:650,d:{...DEF.amiga,skin:'#f0c7a4',hair:'#7b3f1f',hs:'bun',shirt:'#b48cff'},say:'Traz brigadeiro!'}];
    fr.forEach((f,i)=>drawPerson({x:f.x,y:GROUND,d:f.d,still:true,wave:true,seed:i,say:stateT>0.4+i*.5?f.say:null,sayT:1},T+i));
    drawLola(P.x+80,GROUND,{t:T,wave:true});
    if(stateT>2.2)bubble(P.x+80,GROUND-95,'Fui! 💨');
    txt('Toque para pular a cena',W/2,H-24,15,'rgba(255,255,255,.7)');
  } else {
    drawBg(ph.bg,T);
    if(goal)drawGoal(goal,T);
    for(const e of ents){if(e.t==='npc')drawPerson(e,T);else if(e.t==='low')drawLow(e);else if(e.t==='proj')drawProj(e);else drawCol(e)}
    if(!(P.inv>0&&Math.floor(T*12)%2))drawLola(P.x,P.y,{t:T,run:P.onG,duck:P.duck&&P.onG,chest:!!ph.chest,pale:ph.hemo&&hemo<45});
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));if(p.text)txt(p.text,p.x,p.y,18,p.col);else{ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.s,p.s)}}
  ctx.globalAlpha=1;
  if(state==='play'||state==='done'||state==='dead')drawHUD();
  ctx.restore();
}
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;T+=dt;stateT+=dt;shake=Math.max(0,shake-dt);tickMusic();
  if(state==='play')update(dt);
  else if(state==='title'){scroll+=260*dt}
  else if(state==='intro'&&stateT>3.6)showMission(0);
  else if(state==='ending'&&Math.random()<.5)burst(rand(80,W-80),rand(40,200),10,['#ff4fa0','#ffd34e','#3fe0ff','#b48cff','#7ae582'],220);
  updateParts(dt);
  if(state==='title'){drawBg('tokyo',T);drawLola(P.x,GROUND,{t:T,run:true})}else render();
  requestAnimationFrame(loop);
}

/* ---------- panels ---------- */
const KEYS=TOUCH?'Toque em <strong>PULAR</strong> (duas vezes = pulo duplo) e segure <strong>ABAIXAR</strong>. Pule na cabeça dos inimigos!':'<strong>Espaço / ↑</strong> pula (duas vezes = pulo duplo) · <strong>↓</strong> abaixa · pule na cabeça dos inimigos!';
let panelAction=null;
function showPanel(html,btn,action,cls=''){panel.className='panel '+cls;panel.innerHTML=`<div class="card">${html}<button class="go" id="goBtn" type="button">${btn}</button></div>`;panel.hidden=false;panelAction=action;const b=document.getElementById('goBtn');b.onclick=()=>{audio();action()};setTimeout(()=>b.focus({preventScroll:true}),50)}
function hidePanel(){panel.hidden=true;panelAction=null}
function showTitle(){state='title';showPanel(`<p class="msg">🎂 Feliz aniversário, Lola! 🎂</p><div class="eyebrow">Um jogo de aniversário em 5 fases</div><h1>A Saga da Lola</h1><p>Do Japão até o dragão. Heroína com <strong>1,50 m</strong> de altura: ótima pra passar por baixo das coisas.</p><p class="keys">${KEYS}</p>`,'JOGAR',()=>{score=0;hearts=3;state='intro';stateT=0;hidePanel();playSong('p0')});if(!music)playSong('title')}
function showMission(i){
  state='card';const ph=PH[i];
  showPanel(`<div class="eyebrow">Fase ${i+1} de 5 · Missão</div><h2>${ph.name}</h2><p>${ph.mission}</p>${i===0?`<p class="keys">${KEYS}</p>`:''}`,'COMEÇAR',()=>startPhase(i));
}
function showDone(){
  const ph=PH[pi],nx=PH[pi+1];
  showPanel(`<div class="eyebrow">Fase ${pi+1} completa · ${score} pontos</div><h2>${ph.done}</h2>${ph.party?`<p>Você juntou <strong>${party}</strong> itens da festa.</p>`:''}<p><strong>Próxima fase: ${nx.name}.</strong> ${nx.mission}</p>`,`FASE ${pi+2}`,()=>startPhase(pi+1));
}
function showDead(){
  showPanel(`<div class="eyebrow">Fase ${pi+1} · ${PH[pi].name}</div><h2>A Lola cansou!</h2><p>Respira, toma uma água e tenta de novo. A fase recomeça com 3 corações.</p>`,'TENTAR DE NOVO',()=>{score=phaseScore;hearts=3;startPhase(pi)});
}
function showEnding(){
  playSong('end');
  showPanel(`<div class="eyebrow">Missão cumprida · ${score} pontos</div><p class="msg">Feliz aniversário!!! Que nesse ano você consiga montar um dragão com suas tetas novas, e tenha mtos anos de vida a seguir !!! Amo vc trem!</p>`,'JOGAR DE NOVO',()=>{playSong('title');showTitle()},'ending');
}

/* ---------- input ---------- */
function jump(){audio();if(state==='play')jumpQ=true;else if(state==='intro')showMission(0)}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){if(state==='play'||state==='intro'){e.preventDefault();if(!e.repeat)jump()}}
  if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();duckKey=true}
});
addEventListener('keyup',e=>{if(['ArrowDown','KeyS'].includes(e.code))duckKey=false});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
const bJ=document.getElementById('bJump'),bD=document.getElementById('bDuck');
bJ.addEventListener('pointerdown',e=>{e.preventDefault();bJ.classList.add('on');jump()});
['pointerup','pointercancel','pointerleave'].forEach(n=>bJ.addEventListener(n,()=>bJ.classList.remove('on')));
bD.addEventListener('pointerdown',e=>{e.preventDefault();audio();duckBtn=true;bD.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(n=>bD.addEventListener(n,()=>{duckBtn=false;bD.classList.remove('on')}));
addEventListener('blur',()=>{duckKey=duckBtn=false});

fit();showTitle();requestAnimationFrame(loop);
if(document.fonts)document.fonts.ready.then(fit);
})();
</script>
